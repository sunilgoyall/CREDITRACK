<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Book Body -->
  <g transform="translate(96, 96)">
    <!-- Book Left Page -->
    <path d="M 32 48 C 32 48 80 40 160 56 L 160 272 C 80 256 32 264 32 264 Z" fill="url(#bookGrad)" />
    <!-- Book Right Page -->
    <path d="M 288 48 C 288 48 240 40 160 56 L 160 272 C 240 256 288 264 288 264 Z" fill="url(#bookGrad)" />
    <!-- Spine -->
    <rect x="156" y="52" width="8" height="224" rx="4" fill="#047857" opacity="0.4" />
    <!-- Indian Rupee / Checkmark in Gold & Emerald -->
    <circle cx="160" cy="140" r="48" fill="#059669" />
    <path d="M 142 140 L 154 152 L 180 126" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Rupee / Credit lines -->
    <line x1="60" y1="96" x2="130" y2="96" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="128" x2="120" y2="128" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="160" x2="130" y2="160" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="190" y1="96" x2="260" y2="96" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="200" y1="128" x2="260" y2="128" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="190" y1="160" x2="260" y2="160" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
